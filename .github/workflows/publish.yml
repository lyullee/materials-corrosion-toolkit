name: Publish research alpha
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install '.[science,thermo,dev]' build twine
      - name: Check published module documentation
        run: python scripts/validate_publication_docs.py
      - name: Run bounded alpha release checks
        run: >-
          python -m pytest -q
          tests/test_prepublish_runtime_regressions.py
          tests/test_core_without_science_imports.py
          tests/test_crevice_component_state_bdf_kinetics.py
          tests/test_crevice_stage_kinetic_rates.py
          tests/test_prepublish_source_boundary.py
          tests/test_build_release_catalog_sync.py
          tests/test_public_source_boundary.py
          tests/test_release_rights_audit.py
          tests/test_physical_consistency_review.py
      - run: python scripts/audit_schema_coverage.py
      - run: python scripts/audit_public_source_boundary.py
      - run: python scripts/audit_release_rights.py --as-of 2026-11-03
      - run: python -m build --outdir artifacts/prepublish-dist
      - run: python -m twine check artifacts/prepublish-dist/*
      - run: python scripts/audit_prepublish_artifacts.py
      - name: Verify core installation without science extras
        shell: bash
        run: |
          python -m venv /tmp/materials-corrosion-core
          /tmp/materials-corrosion-core/bin/python -m pip install artifacts/prepublish-dist/*.whl
          /tmp/materials-corrosion-core/bin/python -I scripts/smoke_core.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: |
            artifacts/prepublish-dist/*.whl
            artifacts/prepublish-dist/*.tar.gz
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/materials-corrosion-toolkit/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist
      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
