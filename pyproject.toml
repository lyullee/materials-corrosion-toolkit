[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "materials-corrosion-toolkit"
version = "0.1.0a1"
description = "Modular materials, corrosion, structural integrity and inspection calculations with explicit evidence contracts"
authors = [{name = "Ugwiyeon Lee"}]
keywords = ["corrosion", "materials", "integrity", "inspection", "fatigue", "electrochemistry"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["numpy>=2,<3", "pydantic>=2.10,<3", "pint>=0.24,<1"]

[project.optional-dependencies]
science = ["scipy>=1.15,<2", "pandas>=2.2,<4", "rainflow>=3.2,<4", "h5py>=3.11,<4", "openpyxl>=3.1,<4", "xlrd>=2.0,<3", "pydicom>=3,<4"]
thermo = ["CoolProp>=8,<9"]
ebsd = ["DefDAP>=1.3,<2"]
dev = ["pytest>=8,<10", "build>=1,<2", "ruff>=0.12,<1", "truststore>=0.10,<1", "xlwt>=1.3,<2"]

[project.scripts]
matintegrity = "matintegrity.cli:main"

[project.urls]
Homepage = "https://github.com/lyullee/materials-corrosion-toolkit"
Documentation = "https://github.com/lyullee/materials-corrosion-toolkit/blob/main/README.md"
Repository = "https://github.com/lyullee/materials-corrosion-toolkit"
Issues = "https://github.com/lyullee/materials-corrosion-toolkit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
matintegrity = ["catalog_data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["artifacts", "data/evidence", "data/raw", "tmp"]

[tool.ruff.lint]
select = ["E4", "E9", "F", "I", "B"]
